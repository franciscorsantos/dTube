<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%22.9em%22 font-size=%2290%22>📥</text></svg>">
</head>
<body>

  <main class="app-container">
    
    <!-- Cabeçalho Principal -->
    <header class="header">
      <div class="brand">
        <!-- Ícone do YouTube -->
        <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <h1>YouTube Downloader</h1>
      </div>
      <p>Insira o link do vídeo, escolha a pasta no seu computador e baixe com facilidade.</p>
    </header>

    <!-- Card de Entrada e Ações -->
    <section class="card" aria-label="Controles de Download">
      <form id="download-form" class="input-group" onsubmit="event.preventDefault();">
        
        <!-- Campo do Link do YouTube -->
        <div class="url-input-wrapper">
          <!-- Ícone Link -->
          <svg class="url-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>

          <input 
            type="url" 
            id="url-input" 
            class="url-input" 
            placeholder="Cole o link do YouTube aqui (ex: https://www.youtube.com/watch?v=...)"
            required
            autocomplete="off"
            spellcheck="false"
          >

          <div class="input-actions">
            <!-- Botão Colar -->
            <button type="button" id="btn-paste" class="icon-btn" title="Colar da área de transferência">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              </svg>
            </button>
            <!-- Botão Limpar -->
            <button type="button" id="btn-clear" class="icon-btn" title="Limpar campo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Opções de Formato e Resolução -->
        <div class="options-row">
          <div class="option-field">
            <label for="format-select">Formato</label>
            <select id="format-select" class="select-control">
              <option value="mp4" selected>Vídeo (.mp4)</option>
              <option value="mp3">Áudio (.mp3)</option>
            </select>
          </div>

          <div class="option-field">
            <label for="quality-select">Qualidade</label>
            <select id="quality-select" class="select-control">
              <option value="best" selected>Melhor Qualidade (Padrão)</option>
              <option value="1080p">1080p Full HD</option>
              <option value="720p">720p HD</option>
              <option value="480p">480p</option>
              <option value="360p">360p</option>
            </select>
          </div>
        </div>

        <!-- Botões de Ação -->
        <div class="actions-row">
          <button type="button" id="btn-info" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span id="btn-info-text">Buscar Informações</span>
          </button>

          <button type="button" id="btn-download" class="btn btn-primary">
            <!-- Ícone Download -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span id="btn-download-text">Iniciar Download</span>
          </button>
        </div>

      </form>
    </section>

    <!-- Área de Alertas e Notificações -->
    <div id="alert-box" class="alert hidden" role="alert">
      <span id="alert-message"></span>
    </div>

    <!-- Espaço para Mostrar Informações do Vídeo -->
    <section id="video-card" class="card video-card hidden" aria-label="Informações do Vídeo">
      <div class="video-header">
        <div class="thumbnail-wrapper">
          <img id="video-thumbnail" class="video-thumbnail" src="" alt="Thumbnail do vídeo">
          <span id="video-duration" class="duration-badge">00:00</span>
        </div>
        <div class="video-details">
          <h2 id="video-title" class="video-title">Título do Vídeo</h2>
          <div class="video-channel">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span id="video-author">Nome do Canal</span>
          </div>
          <div id="formats-tags" class="video-formats-taglist">
            <!-- Badges de formatos disponíveis são inseridas via JavaScript -->
          </div>
        </div>
      </div>
    </section>

    <!-- Barra de Progresso do Download -->
    <section id="progress-card" class="card progress-card hidden" aria-label="Progresso do Download">
      <div class="progress-status-row">
        <div class="status-label">
          <span id="status-spinner" class="spinner" style="color: var(--primary-color);"></span>
          <span id="progress-status">Preparando download...</span>
        </div>
        <span id="progress-percent" class="percentage-label">0%</span>
      </div>

      <div class="progress-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>

      <div class="progress-stats-row">
        <span id="progress-bytes">0 MB / 0 MB</span>
        <span id="progress-speed">0 MB/s</span>
      </div>
    </section>

    <!-- Rodapé e Configuração de API -->
    <footer class="footer-settings">
      <span>API Endpoint: <strong id="api-endpoint-label">http://localhost:8000/api</strong></span>
      <span>•</span>
      <a id="btn-change-api" href="#">Alterar API</a>
    </footer>

  </main>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
